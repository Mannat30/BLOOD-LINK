<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="720" fill="#f8fafc"/>
<text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">BloodLink — System Architecture</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="15" fill="#64748b">Role-based blood request, donor matching and notification workflow</text>

<rect x="60" y="145" width="320" height="205" rx="18" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#s)"/><rect x="60" y="145" width="320" height="52" rx="18" fill="#fee2e2"/><rect x="60" y="178" width="320" height="19" fill="#fee2e2"/>
<text x="220" y="178" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#991b1b">React Frontend</text>
<text x="90" y="230" font-family="Arial" font-size="16" fill="#334155">• Patient Portal</text><text x="90" y="258" font-family="Arial" font-size="16" fill="#334155">• Donor Portal</text><text x="90" y="286" font-family="Arial" font-size="16" fill="#334155">• Hospital Portal</text><text x="90" y="314" font-family="Arial" font-size="16" fill="#334155">• Axios + React Router</text>

<rect x="440" y="125" width="320" height="245" rx="18" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#s)"/><rect x="440" y="125" width="320" height="52" rx="18" fill="#dbeafe"/><rect x="440" y="158" width="320" height="19" fill="#dbeafe"/>
<text x="600" y="158" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#1e3a8a">Spring Boot Backend</text>
<text x="470" y="210" font-family="Arial" font-size="16" fill="#334155">• REST Controllers</text><text x="470" y="238" font-family="Arial" font-size="16" fill="#334155">• Service Layer</text><text x="470" y="266" font-family="Arial" font-size="16" fill="#334155">• Spring Data JPA</text><text x="470" y="294" font-family="Arial" font-size="16" fill="#334155">• Spring Security + JWT</text><text x="470" y="322" font-family="Arial" font-size="16" fill="#334155">• Matching &amp; Ranking</text><text x="470" y="350" font-family="Arial" font-size="16" fill="#334155">• Notifications / Donations</text>

<rect x="820" y="145" width="320" height="205" rx="18" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#s)"/><rect x="820" y="145" width="320" height="52" rx="18" fill="#dcfce7"/><rect x="820" y="178" width="320" height="19" fill="#dcfce7"/>
<text x="980" y="178" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#166534">PostgreSQL + PostGIS</text>
<text x="850" y="230" font-family="Arial" font-size="16" fill="#334155">• Users / Roles</text><text x="850" y="258" font-family="Arial" font-size="16" fill="#334155">• Patients / Donors</text><text x="850" y="286" font-family="Arial" font-size="16" fill="#334155">• Hospitals</text><text x="850" y="314" font-family="Arial" font-size="16" fill="#334155">• Blood Requests</text><text x="850" y="342" font-family="Arial" font-size="16" fill="#334155">• Geographic Queries</text>
<line x1="380" y1="245" x2="440" y2="245" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><text x="410" y="228" text-anchor="middle" font-family="Arial" font-size="13" fill="#64748b">REST</text><line x1="760" y1="245" x2="820" y2="245" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><text x="790" y="228" text-anchor="middle" font-family="Arial" font-size="13" fill="#64748b">JPA</text>

<rect x="105" y="435" width="990" height="205" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#s)"/><text x="600" y="475" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Donor Matching Workflow</text>

<g font-family="Arial"><rect x="135" y="505" width="145" height="70" rx="12" fill="#fff1f2" stroke="#fecdd3"/><text x="207" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#9f1239">Blood Request</text><text x="207" y="555" text-anchor="middle" font-size="12" fill="#64748b">Patient / Hospital</text>
<rect x="330" y="505" width="145" height="70" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="402" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Eligibility</text><text x="402" y="555" text-anchor="middle" font-size="12" fill="#64748b">Availability + group</text>
<rect x="525" y="505" width="145" height="70" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/><text x="597" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Geo Filter</text><text x="597" y="555" text-anchor="middle" font-size="12" fill="#64748b">PostGIS distance</text>
<rect x="720" y="505" width="145" height="70" rx="12" fill="#fefce8" stroke="#fde68a"/><text x="792" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#854d0e">Ranking</text><text x="792" y="555" text-anchor="middle" font-size="12" fill="#64748b">Matching score</text>
<rect x="915" y="505" width="145" height="70" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/><text x="987" y="534" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Notify Donor</text><text x="987" y="555" text-anchor="middle" font-size="12" fill="#64748b">Response workflow</text></g>
<line x1="280" y1="540" x2="330" y2="540" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><line x1="475" y1="540" x2="525" y2="540" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><line x1="670" y1="540" x2="720" y2="540" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><line x1="865" y1="540" x2="915" y2="540" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<text x="600" y="612" text-anchor="middle" font-family="Arial" font-size="13" fill="#64748b">Docker Compose runs the backend and PostgreSQL/PostGIS services locally</text>
</svg>
